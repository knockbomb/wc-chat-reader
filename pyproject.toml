[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wc-chat-reader"
version = "0.1.0"
description = "WeChat local chat history reader with HTTP API and MCP integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "knockbomb" }]
keywords = ["wechat", "chatlog", "mcp", "sqlcipher"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sse-starlette>=2.1.0",
    "typer>=0.12.5",
    "rich>=13.9.0",
    "loguru>=0.7.2",
    "pycryptodome>=3.21.0",
    "psutil>=6.1.0",
    "pywin32>=308; sys_platform == 'win32'",
    "protobuf>=5.28.0",
    "lz4>=4.3.3",
    "zstandard>=0.23.0",
    "pillow>=11.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
frida = ["frida>=16.5.0", "frida-tools>=13.7.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "hypothesis>=6.115.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-psutil",
    "types-protobuf",
]

[project.scripts]
wcreader = "wc_chat_reader.cli.main:app"

[project.urls]
Repository = "https://github.com/knockbomb/wc-chat-reader"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM",
    "PL", "RUF", "S", "A", "TCH", "PTH",
]
ignore = ["S101", "PLR0913", "PLR2004", "S603", "S606", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "PLR"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
mypy_path = "src"
packages = ["wc_chat_reader"]

[[tool.mypy.overrides]]
module = ["frida.*", "win32api.*", "win32process.*", "win32con.*", "psutil.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src/wc_chat_reader",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: unit tests",
    "integration: integration tests requiring WeChat process",
    "slow: slow tests",
    "windows: Windows-only tests",
]

[tool.coverage.run]
source = ["src/wc_chat_reader"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
